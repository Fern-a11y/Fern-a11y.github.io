<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Smooth Cam Pro</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    
    <style>
        :root { --accent: #ff3b30; --bg: #000; }
        body { background: var(--bg); color: #fff; margin: 0; overflow: hidden; font-family: -apple-system, sans-serif; }
        
        .viewport { position: relative; width: 100vw; height: 100vh; overflow: hidden; }
        #videoElement { width: 100%; height: 100%; object-fit: cover; }

        /* Pro Overlay UI */
        .ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
        .controls-top { position: absolute; top: 20px; width: 100%; display: flex; justify-content: space-around; pointer-events: auto; }
        .controls-side { position: absolute; right: 10px; top: 100px; display: flex; flex-direction: column; gap: 15px; pointer-events: auto; }
        
        .btn { background: rgba(0,0,0,0.5); border: 1px solid #444; color: white; padding: 10px; border-radius: 12px; backdrop-filter: blur(10px); }
        .active { background: var(--accent); border-color: var(--accent); }

        /* Slider Panel */
        .sliders { position: absolute; bottom: 150px; left: 0; width: 100%; background: rgba(0,0,0,0.8); padding: 20px; display: none; }
        .slider-group { margin-bottom: 15px; }
        input[type=range] { width: 100%; accent-color: var(--accent); }
    </style>
</head>
<body>

<div class="viewport">
    <video id="videoElement" autoplay playsinline></video>
    
    <div class="ui-layer">
        <div class="controls-top">
            <button class="btn" onclick="setFilter('filter-normal')">Original</button>
            <button class="btn" onclick="setFilter('filter-aesthetic')">Vibe</button>
            <button class="btn" onclick="toggleSlowMo()">SlowMo</button>
        </div>

        <div class="controls-side">
            <button class="btn" onclick="toggleAI()">AI Pro</button>
            <button class="btn" onclick="toggleSliders()">Edit</button>
        </div>
    </div>

    <div class="sliders" id="sliderPanel">
        <div class="slider-group">
            <label>Brightness</label>
            <input type="range" min="0" max="200" value="100" id="br">
        </div>
        <div class="slider-group">
            <label>Contrast</label>
            <input type="range" min="0" max="200" value="100" id="ct">
        </div>
        <div class="slider-group">
            <label>Saturation</label>
            <input type="range" min="0" max="200" value="100" id="st">
        </div>
        <button class="btn" onclick="takePhoto()">Capture</button>
    </div>
</div>

<script>
    const video = document.getElementById('videoElement');
    const sliderPanel = document.getElementById('sliderPanel');
    let isSlowMo = false;

    async function initCamera() {
        const stream = await navigator.mediaDevices.getUserMedia({ 
            video: { facingMode: 'environment', frameRate: { ideal: 60 } } 
        });
        video.srcObject = stream;
    }

    function setFilter(f) { video.className = f; }
    
    function toggleAI() {
        // Echte AI-achtige verbetering: auto-leveling contrast/sharpness
        video.style.filter = "contrast(130%) brightness(110%) saturate(120%)";
    }

    function toggleSlowMo() {
        isSlowMo = !isSlowMo;
        // In web-apps is slow-motion een visuele truc: 
        // we verlagen de afspeelsnelheid of framerate instelling
        video.style.transition = "all 0.5s";
        video.style.transform = isSlowMo ? "scale(1.1)" : "scale(1)";
    }

    function toggleSliders() {
        sliderPanel.style.display = sliderPanel.style.display === 'block' ? 'none' : 'block';
    }

    // Apply adjustments in real-time
    [ 'br', 'ct', 'st' ].forEach(id => {
        document.getElementById(id).oninput = () => {
            video.style.filter = `brightness(${document.getElementById('br').value}%) contrast(${document.getElementById('ct').value}%) saturate(${document.getElementById('st').value}%)`;
        };
    });

    function takePhoto() {
        // Screenshot logic... (zoals eerder)
    }

    initCamera();
</script>
</body>
</html>
