<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Smooth Cam Pro Ultimate</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body, html { width: 100%; height: 100%; background: #000; color: #fff; overflow: hidden; }

        .app-container { position: relative; width: 100vw; height: 100vh; display: flex; flex-direction: column; justify-content: space-between; }

        /* Camera Viewport */
        .camera-viewport { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #111; z-index: 1; overflow: hidden; }
        #videoElement, #photoCanvas { width: 100%; height: 100%; object-fit: cover; position: absolute; top: 0; left: 0; }

        /* Live Filters CSS */
        .filter-aesthetic { filter: contrast(125%) brightness(105%) saturate(115%) sepia(20%); }
        .filter-4k { filter: contrast(135%) saturate(125%) drop-shadow(0 0 3px rgba(255,255,255,0.3)); }
        .filter-cyberpunk { filter: contrast(140%) brightness(95%) saturate(160%) hue-rotate(20deg); }
        .filter-y2k { filter: brightness(115%) contrast(110%) saturate(90%) sepia(10%); }
        .filter-moody { filter: contrast(130%) brightness(85%) saturate(90%) hue-rotate(-10deg); }
        .filter-vintage { filter: contrast(110%) brightness(95%) sepia(40%) hue-rotate(-10deg); }
        .filter-normal { filter: none; }

        /* UI Overlay Layers */
        .ui-layer { position: relative; z-index: 10; width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: space-between; pointer-events: none; padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom) 0; }
        .pointer-events-auto { pointer-events: auto; }

        /* Top Filter Strip */
        .top-bar { display: flex; gap: 10px; overflow-x: auto; padding: 15px 20px; scrollbar-width: none; background: linear-gradient(to bottom, rgba(0,0,0,0.8), transparent); }
        .top-bar::-webkit-scrollbar { display: none; }
        .filter-chip { background: rgba(0, 0, 0, 0.5); border: 1px solid rgba(255, 255, 255, 0.2); color: white; padding: 6px 14px; border-radius: 20px; font-size: 12px; white-space: nowrap; backdrop-filter: blur(10px); cursor: pointer; }
        .filter-chip.active { background: #fff; color: #000; font-weight: bold; border-color: #fff; }

        /* Side Controls (AI & Camera Switcher) */
        .side-controls { position: absolute; right: 20px; top: 90px; display: flex; flex-direction: column; gap: 12px; }
        .side-btn { background: rgba(0, 0, 0, 0.5); border: 1px solid rgba(255, 255, 255, 0.2); color: white; width: 44px; height: 44px; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 16px; backdrop-filter: blur(10px); cursor: pointer; }
        .side-btn.active-ai { background: #00d2ff; color: #000; border-color: #00d2ff; font-weight: bold; }

        /* Pro Sliders Drawer */
        .pro-drawer { position: absolute; bottom: 130px; left: 20px; right: 20px; background: rgba(15, 15, 15, 0.85); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.15); border-radius: 20px; padding: 15px; display: none; flex-direction: column; gap: 10px; }
        .slider-row { display: flex; flex-direction: column; gap: 4px; }
        .slider-row label { font-size: 10px; color: #aaa; text-transform: uppercase; letter-spacing: 1px; }
        .slider-row input { width: 100%; accent-color: #fff; }

        /* Bottom Control Bar */
        .bottom-controls { display: flex; justify-content: space-around; align-items: center; padding: 20px; background: linear-gradient(to top, rgba(0,0,0,0.9), transparent); height: 120px; }
        .shutter-btn { width: 75px; height: 75px; border-radius: 50%; background: transparent; border: 4px solid rgba(255, 255, 255, 0.9); cursor: pointer; display: flex; justify-content: center; align-items: center; }
        .shutter-inner { width: 61px; height: 61px; border-radius: 50%; background: white; transition: transform 0.1s; }
        .shutter-btn:active .shutter-inner { transform: scale(0.9); }

        .gallery-thumb { width: 50px; height: 50px; border-radius: 12px; background: #222; border: 2px solid rgba(255,255,255,0.8); background-size: cover; background-position: center; cursor: pointer; }
        .tool-toggle-btn { width: 50px; height: 50px; border-radius: 12px; background: rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.3); color: white; display: flex; justify-content: center; align-items: center; font-size: 18px; backdrop-filter: blur(10px); cursor: pointer; }

        /* Preview / Result Modal */
        #modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 100; flex-direction: column; justify-content: space-between; align-items: center; padding: 40px 20px; }
        #modal img { max-width: 100%; max-height: 55vh; border-radius: 14px; object-fit: contain; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .modal-actions { display: flex; gap: 12px; width: 100%; }
        .action-btn { flex: 1; background: #fff; color: #000; border: none; padding: 14px; border-radius: 25px; font-weight: bold; font-size: 15px; cursor: pointer; text-align: center; }
        .action-btn.secondary { background: #222; color: #fff; border: 1px solid #444; }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- Camera Stream -->
        <div class="camera-viewport">
            <video id="videoElement" autoplay playsinline></video>
            <canvas id="photoCanvas" style="display:none;"></canvas>
        </div>

        <!-- UI Laag -->
        <div class="ui-layer">
            <!-- Filter Scrollbar -->
            <div class="top-bar pointer-events-auto">
                <button class="filter-chip active" onclick="setFilter('filter-aesthetic', this)">✨ Aesthetic</button>
                <button class="filter-chip" onclick="setFilter('filter-4k', this)">⚡ 4K Boost</button>
                <button class="filter-chip" onclick="setFilter('filter-cyberpunk', this)">🌆 Cyberpunk</button>
                <button class="filter-chip" onclick="setFilter('filter-y2k', this)">💿 Y2K Flash</button>
                <button class="filter-chip" onclick="setFilter('filter-moody', this)">🌙 Moody</button>
                <button class="filter-chip" onclick="setFilter('filter-vintage', this)">📼 Vintage</button>
                <button class="filter-chip" onclick="setFilter('filter-normal', this)">Original</button>
            </div>

            <!-- Side Tools -->
            <div class="side-controls pointer-events-auto">
                <button class="side-btn" id="aiBtn" onclick="toggleAI()" title="AI Enhancer">🤖</button>
                <button class="side-btn" onclick="switchCamera()" title="Switch Camera">🔄</button>
            </div>

            <!-- Pro Handmatig Sliders Paneel -->
            <div class="pro-drawer pointer-events-auto" id="proDrawer">
                <div class="slider-row">
                    <label>Exposure / Helderheid</label>
                    <input type="range" min="40" max="160" value="100" id="rangeExp" oninput="applyProAdjustments()">
                </div>
                <div class="slider-row">
                    <label>Contrast</label>
                    <input type="range" min="50" max="180" value="100" id="rangeCon" oninput="applyProAdjustments()">
                </div>
                <div class="slider-row">
                    <label>Kleur Saturatie</label>
                    <input type="range" min="0" max="200" value="100" id="rangeSat" oninput="applyProAdjustments()">
                </div>
            </div>

            <!-- Bottom Controls -->
            <div class="bottom-controls pointer-events-auto">
                <div id="galleryThumb" class="gallery-thumb" onclick="openModalWithLastPhoto()"></div>
                <div class="shutter-btn" onclick="takePhoto()">
                    <div class="shutter-inner"></div>
                </div>
                <div class="tool-toggle-btn" onclick="toggleDrawer()">⚙️</div>
            </div>
        </div>
    </div>

    <!-- Foto Resultaat Modal -->
    <div id="modal">
        <h2 style="font-size: 16px; font-weight: 600;">Smooth Cam Studio</h2>
        <img id="modalImage" src="" alt="Gemaakte foto">
        <div class="modal-actions">
            <button class="action-btn secondary" onclick="closeModal()">Opnieuw</button>
            <button class="action-btn" onclick="saveDirectToPhotos()">Bewaar in Foto's 📲</button>
        </div>
    </div>

    <script>
        const video = document.getElementById('videoElement');
        const canvas = document.getElementById('photoCanvas');
        const galleryThumb = document.getElementById('galleryThumb');
        const modal = document.getElementById('modal');
        const modalImage = document.getElementById('modalImage');
        const aiBtn = document.getElementById('aiBtn');
        const proDrawer = document.getElementById('proDrawer');
        
        let lastPhotoData = null;
        let activeFilterClass = 'filter-aesthetic';
        let aiActive = false;
        let useFrontCamera = false;
        let currentStream = null;

        video.classList.add(activeFilterClass);

        // Start camera met hoge framerate en resolutie
        async function initCamera() {
            if (currentStream) {
                currentStream.getTracks().forEach(track => track.stop());
            }
            try {
                const constraints = {
                    video: { 
                        facingMode: useFrontCamera ? 'user' : 'environment',
                        width: { ideal: 1920 },
                        height: { ideal: 1080 },
                        frameRate: { ideal: 60 }
                    },
                    audio: false
                };
                currentStream = await navigator.mediaDevices.getUserMedia(constraints);
                video.srcObject = currentStream;
            } catch (err) {
                alert("Geef alstublieft cameratoegang in je browserinstellingen.");
            }
        }

        initCamera();

        function switchCamera() {
            useFrontCamera = !useFrontCamera;
            initCamera();
        }

        function setFilter(className, btnElement) {
            video.className = '';
            video.classList.add(className);
            if (aiActive) video.classList.add('filter-4k');
            activeFilterClass = className;

            document.querySelectorAll('.filter-chip').forEach(b => b.classList.remove('active'));
            if (btnElement) btnElement.classList.add('active');
        }

        function toggleAI() {
            aiActive = !aiActive;
            if (aiActive) {
                aiBtn.classList.add('active-ai');
                video.style.filter += ' brightness(108%) contrast(125%) saturate(120%)';
            } else {
                aiBtn.classList.remove('active-ai');
                setFilter(activeFilterClass, document.querySelector('.filter-chip.active'));
            }
        }

        function toggleDrawer() {
            proDrawer.style.display = proDrawer.style.display === 'flex' ? 'none' : 'flex';
        }

        function applyProAdjustments() {
            const exp = document.getElementById('rangeExp').value;
            const con = document.getElementById('rangeCon').value;
            const sat = document.getElementById('rangeSat').value;
            video.style.filter = `brightness(${exp}%) contrast(${con}%) saturate(${sat}%)`;
        }

        function takePhoto() {
            canvas.width = video.videoWidth || 1280;
            canvas.height = video.videoHeight || 720;
            const ctx = canvas.getContext('2d');

            // Spiegel de foto als de selfiecamera wordt gebruikt
            if (useFrontCamera) {
                ctx.translate(canvas.width, 0);
                ctx.scale(-1, 1);
            }

            ctx.filter = window.getComputedStyle(video).filter;
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

            lastPhotoData = canvas.toDataURL('image/jpeg', 0.95);
            galleryThumb.style.backgroundImage = `url(${lastPhotoData})`;
            
            modalImage.src = lastPhotoData;
            modal.style.display = 'flex';
        }

        function openModalWithLastPhoto() {
            if (!lastPhotoData) return;
            modalImage.src = lastPhotoData;
            modal.style.display = 'flex';
        }

        function closeModal() {
            modal.style.display = 'none';
        }

        async function saveDirectToPhotos() {
            if (!lastPhotoData) return;
            try {
                const res = await fetch(lastPhotoData);
                const blob = await res.blob();
                const file = new File([blob], `SmoothCam_${Date.now()}.jpg`, { type: 'image/jpeg' });

                if (navigator.canShare && navigator.canShare({ files: [file] })) {
                    await navigator.share({
                        files: [file],
                        title: 'Smooth Cam Pro Foto',
                    });
                } else {
                    const link = document.createElement('a');
                    link.href = lastPhotoData;
                    link.download = `SmoothCam_${Date.now()}.jpg`;
                    link.click();
                }
                closeModal();
            } catch (error) {
                console.log("Opslaan geannuleerd", error);
            }
        }
    </script>
</body>
</html>
