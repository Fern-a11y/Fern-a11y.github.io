```html
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>HumanVerification</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
      background: #f5f7fa;
    }

    .box {
      text-align: center;
    }

    button {
      background: #1877f2;
      color: white;
      border: none;
      border-radius: 6px;
      padding: 12px 24px;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background: #0d65d9;
    }

    #ip {
      margin-top: 15px;
      font-size: 18px;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <div class="box">
    <button id="ipButton">Show my IP</button>
    <div id="ip"></div>
  </div>

  <script src="verify.js"></script>

  <script>
    document.getElementById("ipButton").addEventListener("click", async () => {
      const output = document.getElementById("ip");

      output.textContent = "Loading...";

      try {
        const response = await fetch(
          "https://api.ipify.org?format=json"
        );

        if (!response.ok) {
          throw new Error("Request failed");
        }

        const data = await response.json();

        output.textContent = "Your IP: " + data.ip;
      } catch (error) {
        output.textContent = "Could not retrieve your IP.";
      }
    });
  </script>

</body>
</html>
