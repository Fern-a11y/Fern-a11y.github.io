<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Smooth Cam Pro</title>
    <style>
        :root {
            --bg-color: #050505;
            --ui-color: rgba(255, 255, 255, 0.9);
            --accent: #ffb800;
            --glass: rgba(0, 0, 0, 0.4);
        }
        * { box-sizing: border-box; touch-action: manipulation; }
        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            background: var(--bg-color); font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
            overflow: hidden; color: white;
        }

        #app-container { position: relative; width: 100%; height: 100%; }
        
        /* Camera Engine */
        #video-viewport { 
            width: 100%; height: 100%; object-fit: cover; 
            transform: scaleX(-1); /* Mirror voor selfie feel */
        }

        /* Overlay UI Layers */
        .ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
        
        /* Header / Tools */
        header { 
            position: absolute; top: 40px; width: 100%; display: flex; justify-content: space-between; 
            padding: 0 20px; z-index: 100; pointer-events: auto;
        }

        /* Pro Slider Interface */
        #control-panel {
            position: absolute; bottom: 150px; left: 0; width: 100%;
            background: linear-gradient(transparent, rgba(0,0,0,0.9));
            padding: 20px; display: flex; flex-direction: column; gap: 15px;
            pointer-events: auto; transition: transform 0.3s;
        }

        .slider-row { display: flex; align-items: center; gap: 15px; }
        input[type=range] { flex: 1; accent-color: var(--accent); }

        /* Shutter Button */
        .bottom-bar {
            position: absolute; bottom: 30px; width: 100%;
            display: flex; justify-content: space-around; align-items: center;
            pointer-events: auto;
        }

        .shutter {
            width: 70px; height: 70px; border-radius: 50%;
            border: 4px solid white; background: rgba(255,255,255,0.2);
        }

        /* Glaseffects */
        .glass { background: var(--glass); backdrop-filter: blur(20px); border-radius: 15px; padding: 10px; }
    </style>
</head>
<body>
    <div id="app-container">
        <video id="video-viewport" autoplay playsinline></video>
        
        <div class="ui-layer">
            <header>
                <div class="glass">Flash: Off</div>
                <div class="glass">Smooth Cam Pro</div>
            </header>

            <div id="control-panel">
                <div class="slider-row"><span>EXP</span><input type="range" id="exposure"></div>
                <div class="slider-row"><span>SAT</span><input type="range" id="saturation"></div>
                <div class="slider-row"><span>CONT</span><input type="range" id="contrast"></div>
            </div>

            <div class="bottom-bar">
                <div id="gallery-preview" style="width:50px;height:50px;background:#333;border-radius:10px;"></div>
                <button class="shutter" id="shutter-btn"></button>
                <button class="glass" id="filter-btn">FILTERS</button>
            </div>
        </div>
    </div>
</body>
</html>
