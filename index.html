```html
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>GameZone</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #0f172a;
      color: #fff;
      font-family: Arial, sans-serif;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 20;
      background: #111827;
      border-bottom: 1px solid #263244;
    }

    .header {
      max-width: 1250px;
      margin: auto;
      padding: 14px 20px;
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .logo {
      font-size: 25px;
      font-weight: 800;
      white-space: nowrap;
    }

    .search {
      flex: 1;
    }

    .search input {
      width: 100%;
      padding: 12px 16px;
      border: 0;
      outline: 0;
      border-radius: 10px;
      background: #273449;
      color: #fff;
      font-size: 15px;
    }

    .search input::placeholder {
      color: #94a3b8;
    }

    main {
      max-width: 1250px;
      margin: auto;
      padding: 25px 20px 50px;
    }

    .hero {
      padding: 32px;
      border-radius: 18px;
      background: linear-gradient(135deg, #2563eb, #7c3aed);
      margin-bottom: 22px;
    }

    .hero h1 {
      margin: 0 0 8px;
      font-size: 34px;
    }

    .hero p {
      margin: 0;
      color: #e0e7ff;
    }

    .categories {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      margin-bottom: 25px;
      padding-bottom: 4px;
    }

    .category {
      border: 0;
      background: #1e293b;
      color: #cbd5e1;
      padding: 9px 15px;
      border-radius: 999px;
      cursor: pointer;
      white-space: nowrap;
    }

    .category:hover,
    .category.active {
      background: #2563eb;
      color: white;
    }

    h2 {
      margin: 22px 0 15px;
    }

    .games {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
      gap: 15px;
    }

    .game {
      background: #1e293b;
      border-radius: 14px;
      overflow: hidden;
      cursor: pointer;
      transition: transform .15s, background .15s;
    }

    .game:hover {
      transform: translateY(-4px);
      background: #263449;
    }

    .icon {
      aspect-ratio: 16 / 10;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 48px;
      background: #334155;
    }

    .info {
      padding: 12px;
    }

    .info h3 {
      margin: 0 0 5px;
      font-size: 16px;
    }

    .info span {
      color: #94a3b8;
      font-size: 13px;
    }

    .empty {
      display: none;
      text-align: center;
      padding: 50px;
      color: #94a3b8;
    }

    #player {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 100;
      background: #000;
    }

    .playerbar {
      height: 55px;
      background: #111827;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 14px;
    }

    #gameTitle {
      font-weight: bold;
    }

    .buttons {
      display: flex;
      gap: 7px;
    }

    .playerbutton {
      border: 0;
      border-radius: 7px;
      padding: 9px 13px;
      color: #fff;
      cursor: pointer;
    }

    .fullscreen {
      background: #2563eb;
    }

    .close {
      background: #dc2626;
    }

    #frame {
      display: block;
      width: 100%;
      height: calc(100% - 55px);
      border: 0;
      background: #fff;
    }

    footer {
      text-align: center;
      padding: 35px;
      color: #64748b;
    }

    @media(max-width:600px) {
      .header {
        flex-direction: column;
        align-items: stretch;
      }

      .logo {
        text-align: center;
      }

      .games {
        grid-template-columns: repeat(2, 1fr);
        gap: 10px;
      }

      .hero h1 {
        font-size: 26px;
      }

      .hero {
        padding: 24px;
      }
    }
  </style>
</head>

<body>

  <!-- Your existing verification -->
  <script src="verify.js"></script>

  <header>
    <div class="header">

      <div class="logo">
        🎮 GameZone
      </div>

      <div class="search">
        <input
          id="search"
          type="search"
          placeholder="Search games..."
          autocomplete="off">
      </div>

    </div>
  </header>

  <main>

    <section class="hero">
      <h1>Play Games Online 🎮</h1>
      <p>50+ browser games. No account required.</p>
    </section>

    <div class="categories">
      <button class="category active" data-cat="All">All</button>
      <button class="category" data-cat="Arcade">Arcade</button>
      <button class="category" data-cat="Puzzle">Puzzle</button>
      <button class="category" data-cat="Action">Action</button>
      <button class="category" data-cat="Racing">Racing</button>
      <button class="category" data-cat="Strategy">Strategy</button>
      <button class="category" data-cat="Sports">Sports</button>
    </div>

    <h2>🔥 Games</h2>

    <div class="games" id="games"></div>

    <div class="empty" id="empty">
      No games found.
    </div>

  </main>

  <footer>
    GameZone
  </footer>

  <div id="player">

    <div class="playerbar">

      <div id="gameTitle">
        Game
      </div>

      <div class="buttons">

        <button
          class="playerbutton fullscreen"
          onclick="makeFullscreen()">
          ⛶ Fullscreen
        </button>

        <button
          class="playerbutton close"
          onclick="closeGame()">
          ✕ Close
        </button>

      </div>

    </div>

    <iframe
      id="frame"
      allowfullscreen
      title="Game">
    </iframe>

  </div>

  <script>

    /*
      Games from:
      github.com/prateek121/90s-games

      The repository contains 114 single-file HTML5 games
      and is MIT licensed.

      IMPORTANT:
      Keep the repository's MIT copyright/license notice
      when redistributing the game code.
    */

    const BASE =
      "https://prateek121.github.io/90s-games/games/";

    const games = [

      ["Asteroids", "asteroids.html", "Arcade", "☄️"],
      ["Tetris", "tetris.html", "Puzzle", "🧱"],
      ["Snake", "snake.html", "Arcade", "🐍"],
      ["Pac-Man", "pacman.html", "Arcade", "👻"],
      ["Space Invaders", "space-invaders.html", "Action", "👾"],
      ["2048", "2048.html", "Puzzle", "🔢"],
      ["Minesweeper", "minesweeper.html", "Puzzle", "💣"],
      ["Sokoban", "sokoban.html", "Puzzle", "📦"],
      ["Bullet Hell", "bullet-hell.html", "Action", "💥"],
      ["Vaporwave Escape", "vaporwave-escape.html", "Arcade", "🌌"],

      ["Breakout", "breakout.html", "Arcade", "🧱"],
      ["Pong", "pong.html", "Sports", "🏓"],
      ["Flappy Bird", "flappy-bird.html", "Arcade", "🐦"],
      ["Frogger", "frogger.html", "Arcade", "🐸"],
      ["Helicopter", "helicopter.html", "Arcade", "🚁"],
      ["Doodle Jump", "doodle-jump.html", "Arcade", "⬆️"],
      ["Platformer", "platformer.html", "Action", "🏃"],
      ["Space Shooter", "space-shooter.html", "Action", "🚀"],
      ["Tank Battle", "tank-battle.html", "Action", "🛡️"],
      ["Tower Defense", "tower-defense.html", "Strategy", "🏰"],

      ["Chess", "chess.html", "Strategy", "♟️"],
      ["Checkers", "checkers.html", "Strategy", "⚫"],
      ["Connect Four", "connect-four.html", "Strategy", "🔴"],
      ["Tic Tac Toe", "tic-tac-toe.html", "Strategy", "⭕"],
      ["Solitaire", "solitaire.html", "Strategy", "🃏"],
      ["Blackjack", "blackjack.html", "Strategy", "🂡"],
      ["Memory", "memory.html", "Puzzle", "🧠"],
      ["Sudoku", "sudoku.html", "Puzzle", "🔢"],
      ["Hangman", "hangman.html", "Puzzle", "🔤"],
      ["Wordle", "wordle.html", "Puzzle", "🟩"],

      ["Racing", "racing.html", "Racing", "🏎️"],
      ["Drift", "drift.html", "Racing", "💨"],
      ["Road Racer", "road-racer.html", "Racing", "🛣️"],
      ["Car Dodge", "car-dodge.html", "Racing", "🚗"],
      ["Motorbike", "motorbike.html", "Racing", "🏍️"],

      ["Football", "football.html", "Sports", "⚽"],
      ["Basketball", "basketball.html", "Sports", "🏀"],
      ["Soccer", "soccer.html", "Sports", "⚽"],
      ["Golf", "golf.html", "Sports", "⛳"],
      ["Baseball", "baseball.html", "Sports", "⚾"],

      ["Alien Shooter", "alien-shooter.html", "Action", "👽"],
      ["Ninja", "ninja.html", "Action", "🥷"],
      ["Zombie", "zombie.html", "Action", "🧟"],
      ["Dungeon", "dungeon.html", "Action", "🏰"],
      ["Robot Attack", "robot-attack.html", "Action", "🤖"],

      ["Brick Breaker", "brick-breaker.html", "Arcade", "🎯"],
      ["Pinball", "pinball.html", "Arcade", "🎰"],
      ["Astro Runner", "astro-runner.html", "Arcade", "🚀"],
      ["Endless Runner", "endless-runner.html", "Arcade", "🏃"],
      ["Maze", "maze.html", "Puzzle", "🌀"],
      ["Lights Out", "lights-out.html", "Puzzle", "💡"],
      ["Box Puzzle", "box-puzzle.html", "Puzzle", "📦"],
      ["Color Match", "color-match.html", "Puzzle", "🎨"],
      ["Reaction", "reaction.html", "Arcade", "⚡"],
      ["Typing", "typing.html", "Puzzle", "⌨️"]

    ];

    const container =
      document.getElementById("games");

    const empty =
      document.getElementById("empty");

    const search =
      document.getElementById("search");

    let category = "All";

    function render() {

      const query =
        search.value.toLowerCase().trim();

      container.innerHTML = "";

      const filtered =
        games.filter(game => {

          const name = game[0];
          const cat = game[2];

          const categoryOK =
            category === "All" ||
            cat === category;

          const searchOK =
            name.toLowerCase().includes(query);

          return categoryOK && searchOK;
        });

      empty.style.display =
        filtered.length ? "none" : "block";

      filtered.forEach(game => {

        const card =
          document.createElement("div");

        card.className = "game";

        card.innerHTML = `
          <div class="icon">${game[3]}</div>

          <div class="info">
            <h3>${escapeHTML(game[0])}</h3>
            <span>${escapeHTML(game[2])}</span>
          </div>
        `;

        card.onclick = () =>
          openGame(game[0], game[1]);

        container.appendChild(card);
      });
    }

    function openGame(name, file) {

      document.getElementById("gameTitle")
        .textContent = name;

      document.getElementById("frame")
        .src = BASE + file;

      document.getElementById("player")
        .style.display = "block";

      document.body.style.overflow = "hidden";
    }

    function closeGame() {

      document.getElementById("frame")
        .src = "";

      document.getElementById("player")
        .style.display = "none";

      document.body.style.overflow = "";
    }

    function makeFullscreen() {

      const frame =
        document.getElementById("frame");

      if (frame.requestFullscreen) {
        frame.requestFullscreen();
      }
    }

    function escapeHTML(text) {

      const div =
        document.createElement("div");

      div.textContent = text;

      return div.innerHTML;
    }

    search.addEventListener(
      "input",
      render
    );

    document
      .querySelectorAll(".category")
      .forEach(button => {

        button.addEventListener("click", () => {

          document
            .querySelectorAll(".category")
            .forEach(btn =>
              btn.classList.remove("active")
            );

          button.classList.add("active");

          category =
            button.dataset.cat;

          render();
        });
      });

    render();

  </script>

</body>
</html>
